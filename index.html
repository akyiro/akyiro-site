<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>akyiro</title>
  <meta name="description" content="akyiro - ambient / cyberpunk / metalcore. latest release: unnamed. upcoming ep: the last flower." />
  <meta property="og:title" content="akyiro" />
  <meta property="og:description" content="latest release: unnamed. upcoming ep: the last flower." />
  <meta property="og:image" content="https://akyiro.xyz/assets/og-image.png" />
  <meta property="og:url" content="https://akyiro.xyz" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020100;
      --text: #f2dfc8;
      --soft: #b99678;
      --dim: rgba(242, 180, 115, 0.72);
      --orange: #ff6814;
      --orange-2: #ff8a2a;
      --line: rgba(255, 104, 20, 0.72);
      --line-soft: rgba(255, 104, 20, 0.23);
      --panel: rgba(255, 115, 23, 0.045);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 104, 20, 0.28), transparent 20%),
        radial-gradient(circle at 50% 42%, rgba(255, 104, 20, 0.12), transparent 31%),
        radial-gradient(circle at 50% 78%, rgba(255, 104, 20, 0.08), transparent 32%),
        linear-gradient(180deg, #020100 0%, #070301 47%, #020100 100%);
      color: var(--text);
      font-family: "Michroma", system-ui, sans-serif;
      text-transform: lowercase;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(255, 100, 20, 0.055) 0 1px, transparent 1px 38px),
        repeating-linear-gradient(90deg, rgba(255, 100, 20, 0.024) 0 1px, transparent 1px 76px);
      opacity: 0.22;
      mix-blend-mode: screen;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255, 100, 20, 0.06) 48%, rgba(255, 100, 20, 0.10) 50%, rgba(255, 100, 20, 0.06) 52%, transparent 100%),
        radial-gradient(circle at center, transparent 44%, rgba(0,0,0,0.68) 100%);
      opacity: 0.9;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 34px));
      margin: 0 auto;
      padding: 56px 0 42px;
      text-align: center;
    }

    .logo-wrap {
      width: min(360px, 74vw);
      margin: 0 auto 20px;
      position: relative;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 18% 12%;
      background: radial-gradient(circle, rgba(255, 96, 12, 0.55), transparent 66%);
      filter: blur(28px);
      z-index: -1;
    }

    .logo {
      width: 100%;
      display: block;
      filter:
        drop-shadow(0 0 10px rgba(255, 95, 12, 0.95))
        drop-shadow(0 0 34px rgba(255, 95, 12, 0.55))
        drop-shadow(0 0 84px rgba(255, 95, 12, 0.22));
    }

    h1 {
      margin: 0;
      color: var(--orange-2);
      font-size: clamp(2.85rem, 8.8vw, 5.7rem);
      font-weight: 400;
      letter-spacing: 0.055em;
      text-shadow:
        0 0 14px rgba(255, 110, 20, 0.72),
        0 0 38px rgba(255, 110, 20, 0.28);
    }

    .tagline {
      margin-top: 24px;
      color: var(--text);
      font-size: clamp(0.72rem, 1.8vw, 0.98rem);
      letter-spacing: 0.42em;
      text-shadow: 0 0 14px rgba(255, 160, 90, 0.22);
    }

    .slash {
      color: var(--orange);
      margin: 0 18px;
      text-shadow: 0 0 14px rgba(255, 105, 20, 0.95);
    }

    .divider {
      position: relative;
      height: 1px;
      margin: 58px 0 46px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      box-shadow: 0 0 18px rgba(255, 104, 20, 0.28);
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%) rotate(45deg);
      border: 1px solid var(--orange);
      background: #080301;
      box-shadow: 0 0 16px rgba(255, 104, 20, 0.85);
    }

    .divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: var(--orange-2);
      box-shadow: 0 0 18px rgba(255, 104, 20, 1);
    }

    .label {
      color: var(--orange-2);
      font-size: clamp(0.7rem, 1.35vw, 0.86rem);
      letter-spacing: 0.44em;
      margin-bottom: 28px;
      text-shadow: 0 0 14px rgba(255, 104, 20, 0.72);
    }

    .title {
      margin: 0 0 38px;
      color: var(--text);
      font-size: clamp(2rem, 6.2vw, 4.1rem);
      font-weight: 400;
      letter-spacing: 0.075em;
      text-shadow:
        0 0 12px rgba(255, 200, 155, 0.58),
        0 0 38px rgba(255, 104, 20, 0.28);
    }

    .jp {
      color: #f9bf82;
      text-shadow:
        0 0 12px rgba(255, 104, 20, 0.8),
        0 0 40px rgba(255, 104, 20, 0.25);
    }

    .listen {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      margin-bottom: 30px;
      color: var(--orange-2);
      font-size: 0.86rem;
      letter-spacing: 0.34em;
      text-shadow: 0 0 12px rgba(255, 104, 20, 0.7);
    }

    .listen::before,
    .listen::after {
      content: "";
      width: min(180px, 18vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line));
      box-shadow: 0 0 12px rgba(255, 104, 20, 0.2);
    }

    .listen::after { background: linear-gradient(90deg, var(--line), transparent); }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .button {
      min-height: 92px;
      padding: 22px 24px;
      border: 1px solid rgba(255, 104, 20, 0.88);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 135, 42, 0.075), rgba(255, 104, 20, 0.018)),
        rgba(4, 2, 1, 0.72);
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-size: clamp(0.76rem, 1.3vw, 0.95rem);
      letter-spacing: 0.18em;
      box-shadow:
        inset 0 0 34px rgba(255, 104, 20, 0.055),
        0 0 22px rgba(255, 104, 20, 0.12);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, color 180ms ease;
    }

    .button:hover {
      transform: translateY(-3px);
      color: #fff1df;
      border-color: var(--orange-2);
      box-shadow:
        inset 0 0 38px rgba(255, 104, 20, 0.11),
        0 0 32px rgba(255, 104, 20, 0.34);
    }

    .icon {
      width: 34px;
      height: 34px;
      color: var(--orange);
      flex: none;
      filter: drop-shadow(0 0 11px rgba(255, 104, 20, 0.86));
    }

    .footer-symbol {
      width: 44px;
      height: 44px;
      margin: 60px auto 26px;
      opacity: 0.95;
      filter: drop-shadow(0 0 13px rgba(255, 104, 20, 0.85));
    }

    footer {
      color: var(--dim);
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-shadow: 0 0 12px rgba(255, 104, 20, 0.28);
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 1080px); padding-top: 38px; }
      .logo-wrap { width: min(300px, 82vw); }
      .tagline { letter-spacing: 0.22em; line-height: 2.15; }
      .slash { margin: 0 8px; }
      .divider { margin: 46px 0 38px; }
      .label { letter-spacing: 0.28em; }
      .title { letter-spacing: 0.035em; }
      .listen { gap: 14px; letter-spacing: 0.22em; font-size: 0.78rem; }
      .listen::before, .listen::after { width: 54px; }
      .buttons { grid-template-columns: 1fr; gap: 16px; }
      .button { min-height: 76px; }
    }
  </style>
</head>
