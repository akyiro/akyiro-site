<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>akyiro</title>

  <meta property="og:title" content="akyiro">
  <meta property="og:description" content="ambient / cyberpunk / metalcore">
  <meta property="og:image" content="https://akyiro.xyz/assets/og-image.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://akyiro.xyz">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="akyiro">
  <meta name="twitter:description" content="ambient / cyberpunk / metalcore">
  <meta name="twitter:image" content="https://akyiro.xyz/assets/og-image.png">

  <link rel="icon" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #020202;
      --text: #f2eee9;
      --muted: #9d948d;
      --orange: #d76518;
      --orange-soft: rgba(215, 101, 24, 0.48);
      --orange-glow: rgba(255, 112, 24, 0.18);
      --card: rgba(255,255,255,0.025);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 8%, rgba(215,101,24,0.14), transparent 22%),
        radial-gradient(circle at 50% 60%, rgba(215,101,24,0.045), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: "Michroma", sans-serif;
      text-align: center;
      padding: 42px 18px 34px;
      overflow-x: hidden;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .flower {
      width: min(300px, 72vw);
      margin: 0 auto 28px;
      display: block;
      filter:
        drop-shadow(0 0 10px rgba(255, 112, 24, 0.38))
        drop-shadow(0 0 28px rgba(255, 112, 24, 0.16));
      opacity: 0.96;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 7.2rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: lowercase;
    }

    .tagline {
      margin-top: 24px;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.38em;
      text-transform: lowercase;
    }

    .tagline span {
      color: var(--orange);
      margin: 0 14px;
    }

    .divider {
      height: 1px;
      margin: 62px 0 42px;
      background: linear-gradient(90deg, transparent, var(--orange-soft), transparent);
      position: relative;
    }

    .divider::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 1px solid var(--orange);
      background: var(--bg);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 12px rgba(255, 112, 24, 0.32);
    }

    .label {
      color: var(--orange);
      font-size: 0.74rem;
      letter-spacing: 0.42em;
      text-transform: lowercase;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 4.2rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }

    .status {
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .listen {
      color: var(--orange);
      font-size: 0.78rem;
      letter-spacing: 0.42em;
      text-transform: lowercase;
      margin-bottom: 24px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .button {
      min-height: 82px;
      border: 1px solid rgba(215,101,24,0.62);
      background:
        radial-gradient(circle at 50% 0%, rgba(215,101,24,0.085), transparent 62%),
        var(--card);
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: lowercase;
      transition: 0.22s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--orange);
      box-shadow: 0 0 22px var(--orange-glow);
    }

    .icon {
  font-size: 1.45rem;
  color: var(--orange);
  width: auto;
  height: auto;
  line-height: 1;
    }

    footer {
      margin-top: 62px;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.28em;
    }

    @media (max-width: 720px) {
      body { padding-top: 34px; }

      .flower {
        width: min(230px, 76vw);
      }

      h1 {
        letter-spacing: 0.18em;
        padding-left: 0.18em;
      }

      .tagline {
        letter-spacing: 0.18em;
        line-height: 2;
      }

      .tagline span {
        margin: 0 7px;
      }

      .buttons {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .button {
        min-height: 70px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img class="flower" src="assets/logo-neon.png" alt="akyiro flower logo">

    <h1>akyiro</h1>

    <div class="tagline">
      ambient <span>/</span> cyberpunk <span>/</span> metalcore
    </div>

    <div class="divider"></div>

    <section>
      <div class="label">latest release</div>
      <h2>「unnamed」</h2>
      <div class="status">out now</div>

      <div class="listen">listen now</div>

      <div class="buttons">
        <a class="button" href="https://open.spotify.com/track/4H0ow29yFlq0jaJVZYeMy4?si=33fe7ef119df4812" target="_blank">
  <i class="fa-brands fa-spotify icon"></i>
  spotify
</a>

        <a class="button" href="https://music.apple.com/us/song/unnamed/6776029231" target="_blank">
  <i class="fa-brands fa-apple icon"></i>
  apple music
</a>

        <a class="button" href="https://youtu.be/HgOzBR52dao?si=aEc0F1wmmsmQ2rs5" target="_blank">
  <i class="fa-brands fa-youtube icon"></i>
  youtube music
</a>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="label">upcoming ep</div>
      <h2>「the last flower」</h2>
      <div class="status">coming soon</div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="label">personal links</div>

      <div class="buttons">
  <a class="button" href="https://www.instagram.com/akyiro.music" target="_blank">
    <i class="fa-brands fa-instagram icon"></i>
    instagram
  </a>

  <a class="button" href="https://www.tiktok.com/@akyiro" target="_blank">
    <i class="fa-brands fa-tiktok icon"></i>
    tiktok
  </a>

  <a class="button" href="https://www.youtube.com/@akyiro" target="_blank">
    <i class="fa-brands fa-youtube icon"></i>
    youtube
  </a>
</div>
    </section>

    <footer>© akyiro</footer>
  </main>
</body>
</html>
