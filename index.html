<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKYIRO</title>

  <style>
    :root {
      --bg: #030303;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --orange: #b85f1b;
      --orange-bright: #ff7a1a;
      --card: rgba(255, 255, 255, 0.035);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 10%, rgba(184, 95, 27, 0.14), transparent 28%),
        radial-gradient(circle at 50% 55%, rgba(184, 95, 27, 0.07), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.18em;
      display: flex;
      justify-content: center;
      padding: 48px 18px;
    }

    .page {
      width: 100%;
      max-width: 820px;
      text-align: center;
    }

    .flower {
      width: 150px;
      height: 150px;
      margin: 0 auto 28px;
      filter: drop-shadow(0 0 18px rgba(255, 122, 26, 0.55));
    }

    h1 {
      font-size: clamp(3rem, 10vw, 6.6rem);
      font-weight: 300;
      margin: 0;
      letter-spacing: 0.32em;
      padding-left: 0.32em;
    }

    .tagline {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
    }

    .tagline span {
      color: var(--orange-bright);
      margin: 0 14px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      margin: 58px 0 42px;
      position: relative;
    }

    .divider::after {
      content: "◇";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      color: var(--orange-bright);
      background: var(--bg);
      padding: 0 14px;
      font-size: 1rem;
    }

    .section-label {
      color: var(--orange-bright);
      font-size: 0.78rem;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    h2 {
      font-size: clamp(2.1rem, 8vw, 4rem);
      font-weight: 300;
      margin: 0 0 34px;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
    }

    .listen-title {
      color: var(--orange-bright);
      font-size: 0.9rem;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 74px;
      padding: 18px;
      border: 1px solid rgba(255, 122, 26, 0.58);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.78rem;
      transition: 0.22s ease;
    }

    .button:hover {
      border-color: var(--orange-bright);
      box-shadow: 0 0 22px rgba(255, 122, 26, 0.2);
      transform: translateY(-2px);
    }

    .ep-title {
      margin-bottom: 0;
    }

    footer {
      margin-top: 62px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    @media (max-width: 720px) {
      body {
        padding: 38px 16px;
      }

      .flower {
        width: 120px;
        height: 120px;
      }

      .tagline {
        line-height: 2;
        font-size: 0.72rem;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .button {
        min-height: 62px;
      }

      .divider {
        margin: 44px 0 34px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <svg class="flower" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#ff7a1a" stroke-width="2">
        <path d="M100 104 C70 68, 82 30, 100 58 C118 30, 130 68, 100 104Z"/>
        <path d="M100 104 C48 90, 38 52, 76 70 C62 32, 106 36, 100 104Z"/>
        <path d="M100 104 C152 90, 162 52, 124 70 C138 32, 94 36, 100 104Z"/>
        <path d="M100 104 C78 126, 44 116, 68 96"/>
        <path d="M100 104 C122 126, 156 116, 132 96"/>
        <path d="M100 104 C96 126, 96 150, 100 178"/>
        <path d="M100 140 C74 128, 56 146, 72 162 C86 156, 94 148, 100 140Z"/>
        <path d="M101 148 C128 132, 150 148, 130 166 C116 160, 106 154, 101 148Z"/>
        <circle cx="100" cy="100" r="5"/>
      </g>
    </svg>

    <h1>akyiro</h1>
    <div class="tagline">
      ambient <span>/</span> cyberpunk <span>/</span> metalcore
    </div>

    <div class="divider"></div>

    <section>
      <div class="section-label">Latest Release</div>
      <h2>unnamed</h2>

      <div class="listen-title">Listen Now</div>
      <div class="buttons">
        <a class="button" href="https://open.spotify.com/track/4H0ow29yFlq0jaJVZYeMy4?si=33fe7ef119df4812" target="_blank">Spotify</a>
        <a class="button" href="https://music.apple.com/us/song/unnamed/6776029231" target="_blank">Apple Music</a>
        <a class="button" href="https://youtu.be/HgOzBR52dao?si=aEc0F1wmmsmQ2rs5" target="_blank">YouTube Music</a>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="section-label">upcoming EP</div>
      <h2 class="ep-title">the last flower</h2>
    </section>

    <div class="divider"></div>

    <section>
      <div class="section-label">personal links</div>
      <div class="buttons">
        <a class="button" href="https://www.instagram.com/akyiro.music" target="_blank">Instagram</a>
        <a class="button" href="https://www.tiktok.com/@akyiro" target="_blank">TikTok</a>
        <a class="button" href="https://www.youtube.com/@akyiro" target="_blank">YouTube</a>
      </div>
    </section>

    <footer>© akyiro</footer>
  </main>
</body>
</html>
