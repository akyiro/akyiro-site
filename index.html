<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>akyiro</title>

  <meta property="og:title" content="akyiro">
  <meta property="og:description" content="ambient / digital / melancholy">
  <meta property="og:image" content="https://akyiro.xyz/assets/og-image.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://akyiro.xyz">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="akyiro">
  <meta name="twitter:description" content="ambient / digital / melancholy">
  <meta name="twitter:image" content="https://akyiro.xyz/assets/og-image.png">

  <link rel="icon" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #020202;
      --text: #f2eee9;
      --muted: #9d948d;
      --orange: #d76518;
      --orange-soft: rgba(215, 101, 24, 0.48);
      --orange-glow: rgba(255, 112, 24, 0.18);
      --card: rgba(255,255,255,0.025);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
  radial-gradient(
    circle at 50% 115%,
    rgba(215,101,24,0.14),
    transparent 30%
  ),
  #000;
      color: var(--text);
      font-family: "Michroma", sans-serif;
      text-align: center;
      padding: 42px 18px 34px;
      overflow-x: hidden;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .main-logo {
  width: min(620px, 88vw);
  margin: 0 auto 28px;
  display: block;

  filter:
    drop-shadow(0 0 8px rgba(255,112,24,.28))
    drop-shadow(0 0 24px rgba(255,112,24,.12));

  opacity: 0.96;
    }


    .tagline {
      margin-top: 24px;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.38em;
      text-transform: lowercase;
    }

    .tagline span {
      color: var(--orange);
      margin: 0 14px;
    }

    .divider {
      height: 1px;
      margin: 62px 0 42px;
      background: linear-gradient(90deg, transparent, var(--orange-soft), transparent);
      position: relative;
    }

    .divider::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 1px solid var(--orange);
      background: var(--bg);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 10px rgba(255,112,24,.25);
    }

    .label {
      color: var(--orange);
      font-size: 0.74rem;
      letter-spacing: 0.42em;
      text-transform: lowercase;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 4.2rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }

    .status {
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .listen {
      color: var(--orange);
      font-size: 0.78rem;
      letter-spacing: 0.42em;
      text-transform: lowercase;
      margin-bottom: 24px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
    }

 .button {
  position: relative;
  min-height: 82px;
  padding: 0 24px;

  background: transparent;
  border: none;

  color: var(--text);
  text-decoration: none;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;

  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: lowercase;
  white-space: nowrap;

  transition: transform 0.22s ease, color 0.22s ease;
}

.button::before {
  content: "";

  position: absolute;
  top: 10px;
  left: 10px;

  width: 55px;
  height: 22px;

  border-top: 1px solid rgba(215,101,24,0.85);
  border-left: 1px solid rgba(215,101,24,0.85);

  transition: border-color 0.22s ease;
  pointer-events: none;
}

.button::after {
  content: "";

  position: absolute;
  bottom: 10px;
  right: 10px;

  width: 55px;
  height: 22px;

  border-bottom: 1px solid rgba(215,101,24,0.85);
  border-right: 1px solid rgba(215,101,24,0.85);

  transition: border-color 0.22s ease;
  pointer-events: none;
}

.button:nth-child(even)::before {
  left: auto;
  right: 10px;

  border-left: none;
  border-right: 1px solid rgba(215,101,24,.85);
  border-top: 1px solid rgba(215,101,24,.85);
}

.button:nth-child(even)::after {
  right: auto;
  left: 10px;

  border-right: none;
  border-left: 1px solid rgba(215,101,24,.85);
  border-bottom: 1px solid rgba(215,101,24,.85);
}

.button:hover {
  transform: translateY(-2px);
  color: #ffffff;
}

.button:hover::before,
.button:hover::after {
    border-color: #ff9a47;
}

    .icon {
      font-size: 1.45rem;
      color: var(--orange);
      width: auto;
      height: auto;
      line-height: 1;
      filter: drop-shadow(0 0 5px rgba(255,112,24,0.22));
    }

    footer {
      margin-top: 62px;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.28em;
    }

    @media (max-width: 720px) {
  body {
    padding-top: 34px;
  }

  .main-logo {
    width: min(360px, 72vw);
    margin: 0 auto 18px;
  }

  .tagline {
    letter-spacing: 0.16em;
    line-height: 2;
  }

  .tagline span {
    margin: 0 7px;
  }

  h2 {
    font-size: clamp(2.1rem, 10vw, 3rem);
    letter-spacing: 0.1em;
  }

  .ep-title {
    white-space: nowrap;
    font-size: clamp(2rem, 8.8vw, 2.7rem);
    letter-spacing: 0.08em;
  }

  .buttons {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .button {
    min-height: 70px;
    font-size: 0.68rem;
  }

  .button::before,
  .button::after {
    width: 46px;
    height: 18px;
  }
}
  </style>
</head>

<body>
  <main class="page">
    <img class="main-logo" src="assets/akyiro-logo-full-transparent.png" alt="akyiro logo">

    <div class="tagline">
      ambient <span>/</span> digital <span>/</span> melancholy
    </div>

    <div class="divider"></div>

    <section>
      <div class="label">_latest release</div>
      <h2>「unnamed」</h2>
      <div class="status">out now</div>

      <div class="listen">listen now_</div>

      <div class="buttons">
        <a class="button" href="https://open.spotify.com/track/4H0ow29yFlq0jaJVZYeMy4?si=33fe7ef119df4812" target="_blank" rel="noopener noreferrer">
  <i class="fa-brands fa-spotify icon"></i>
  spotify
</a>

        <a class="button" href="https://music.apple.com/us/song/unnamed/6776029231" target="_blank" rel="noopener noreferrer">
  <i class="fa-brands fa-apple icon"></i>
  apple music
</a>

        <a class="button" href="https://youtu.be/HgOzBR52dao?si=aEc0F1wmmsmQ2rs5" target="_blank" rel="noopener noreferrer">
  <i class="fa-brands fa-youtube icon"></i>
  youtube music
</a>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="label">_upcoming ep</div>
      <h2 class="ep-title">「the last flower」</h2>
      <div class="status">coming soon</div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="label">personal links_</div>

      <div class="buttons">
  <a class="button" href="https://www.instagram.com/akyiro.music" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-instagram icon"></i>
    instagram
  </a>

  <a class="button" href="https://www.tiktok.com/@akyiro" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-tiktok icon"></i>
    tiktok
  </a>

  <a class="button" href="https://www.youtube.com/@akyiro" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-youtube icon"></i>
    youtube
  </a>
</div>
    </section>

    <footer>© akyiro</footer>
  </main>
</body>
</html>
