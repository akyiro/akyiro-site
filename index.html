<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>akyiro</title>

  <meta property="og:title" content="akyiro">
  <meta property="og:description" content="ambient / digital / melancholy">
  <meta property="og:image" content="https://akyiro.xyz/assets/og-image.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://akyiro.xyz">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="akyiro">
  <meta name="twitter:description" content="ambient / digital / melancholy">
  <meta name="twitter:image" content="https://akyiro.xyz/assets/og-image.png">

  <link rel="icon" href="./assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #050201;
      --panel: rgba(11, 5, 2, 0.08);
      --panel-strong: rgba(11, 5, 2, 0.18);
      --text: #f3eee8;
      --muted: #b4a49a;
      --line: rgba(222, 108, 31, 0.40);
      --line-soft: rgba(222, 108, 31, 0.18);
      --orange: #de6c1f;
      --orange-bright: #ff983f;
      --shadow: rgba(255, 119, 26, 0.22);
      --ui: "Inter", system-ui, sans-serif;
      --display: "Michroma", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--display);
      overflow-x: hidden;
      background: var(--bg);
      display: grid;
      place-items: start center;
      padding: 28px 0 16px;
      position: relative;
    }

    .bg-scene {
      position: fixed;
      inset: -2.8%;
      z-index: -3;
      background:
        linear-gradient(180deg, rgba(6, 2, 1, 0.28) 0%, rgba(6, 2, 1, 0.18) 32%, rgba(6, 2, 1, 0.50) 100%),
        linear-gradient(90deg, rgba(0,0,0,0.42), rgba(0,0,0,0.08) 20%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.08) 80%, rgba(0,0,0,0.42)),
        url("./assets/hero-bg.png") center center / cover no-repeat;
      transform: translate3d(0,0,0) scale(1.045);
      will-change: transform, background-position;
      transition: transform .22s ease-out;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 22%, rgba(255, 139, 58, 0.10), transparent 36%),
        linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.12) 25%, rgba(0,0,0,0.34) 78%, rgba(0,0,0,0.58) 100%);
    }

    .hud-rail {
      position: fixed;
      top: 14px;
      bottom: 14px;
      width: 58px;
      z-index: 5;
      pointer-events: none;
      color: rgba(223, 121, 45, 0.72);
      font: 600 0.52rem/1.5 var(--ui);
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .hud-rail::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, rgba(222,108,31,0), rgba(222,108,31,0.55) 12%, rgba(222,108,31,0.20) 52%, rgba(222,108,31,0.55) 88%, rgba(222,108,31,0));
    }

    .hud-rail--left { left: 18px; width: 150px; }
    .hud-rail--right { right: 18px; }
    .hud-rail--left::before { left: 26px; }
    .hud-rail--right::before { right: 26px; }

    .hud-rail__copy {
      position: absolute;
      left: 38px;
      bottom: 4px;
      display: grid;
      gap: 8px;
      min-width: 108px;
      text-align: left;
      opacity: 0.88;
    }

    .hud-rail__dash {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .hud-rail__dash i {
      display: block;
      width: 16px;
      height: 2px;
      background: rgba(223, 121, 45, 0.55);
    }

    .page {
      width: min(1190px, calc(100vw - 150px));
      text-align: center;
      padding: 30px 36px 22px;
      position: relative;
    }

    .main-logo {
      display: block;
      width: min(342px, 52vw);
      margin: 0 auto 6px;
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(255, 118, 26, 0.28)) drop-shadow(0 0 28px rgba(255, 118, 26, 0.12));
      animation: fade-up 0.9s ease 0.08s forwards;
    }

    .tagline {
      color: var(--muted);
      font: 400 0.70rem/1.6 var(--ui);
      letter-spacing: 0.30em;
      text-transform: lowercase;
      opacity: 0;
      animation: fade-up 0.85s ease 0.2s forwards;
    }
    .tagline i { color: var(--orange); font-style: normal; margin: 0 10px; }

    .divider {
      position: relative;
      width: min(810px, 100%);
      height: 1px;
      margin: 24px auto 19px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      opacity: 0;
      animation: fade-up 0.85s ease 0.32s forwards;
    }

    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%) rotate(45deg);
      border: 1px solid rgba(255, 141, 59, 0.9);
      background: rgba(8, 3, 1, 0.55);
      box-shadow: 0 0 10px rgba(255, 118, 26, 0.14);
    }

    .section {
      padding: 13px 0 11px;
      opacity: 0;
      transform: translateY(10px);
      animation: fade-up 0.82s ease forwards;
    }
    .section--release { animation-delay: 0.42s; }
    .section--ep { animation-delay: 0.58s; }
    .section--links { animation-delay: 0.74s; }
    footer { animation-delay: 0.90s; }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--orange);
      font: 600 0.66rem/1 var(--ui);
      letter-spacing: 0.42em;
      text-transform: lowercase;
    }

    h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: clamp(2.08rem, 4.35vw, 3.48rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      text-shadow: 0 0 18px rgba(255, 118, 26, 0.06);
    }

    .bracket-title::before { content: "「"; margin-right: 0.06em; }
    .bracket-title::after { content: "」"; margin-left: 0.06em; }

    .status {
      color: var(--muted);
      font: 500 0.64rem/1.4 var(--ui);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .listen {
      color: var(--orange);
      font: 600 0.66rem/1 var(--ui);
      letter-spacing: 0.34em;
      text-transform: lowercase;
      margin-bottom: 12px;
    }

    .buttons {
      width: min(900px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .button {
      position: relative;
      min-height: 56px;
      padding: 13px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #efe8e2;
      text-decoration: none;
      background: linear-gradient(180deg, rgba(255, 126, 31, 0.02), rgba(0,0,0,0.02));
      border: 1px solid rgba(222, 108, 31, 0.55);
      clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
      font: 600 0.66rem/1 var(--ui);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      transition: transform .22s ease, border-color .22s ease, background .22s ease, color .22s ease;
      overflow: hidden;
    }

    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-110%);
      background: linear-gradient(90deg, transparent, rgba(255, 153, 69, 0.14), transparent);
      transition: transform .55s ease;
    }

    .button::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 3px;
      height: 3px;
      background: var(--orange-bright);
      box-shadow: 0 0 7px rgba(255, 151, 63, 0.55);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 153, 69, 0.9);
      background: rgba(255, 120, 25, 0.07);
      color: #fff;
      outline: none;
    }

    .button:hover::before,
    .button:focus-visible::before { transform: translateX(110%); }

    .icon {
      color: var(--orange);
      font-size: 1.08rem;
      filter: drop-shadow(0 0 7px rgba(255, 119, 26, 0.20));
    }

    footer {
      margin-top: 10px;
      color: rgba(180, 164, 154, 0.82);
      font: 400 0.60rem/1 var(--ui);
      letter-spacing: 0.30em;
      opacity: 0;
      transform: translateY(10px);
      animation: fade-up 0.82s ease forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 960px) {
      .page { width: min(990px, calc(100vw - 80px)); }
      .hud-rail { display: none; }
    }

    @media (min-width: 721px) and (max-height: 900px) {
      body { padding-top: 16px; }
      .main-logo { width: min(289px, 44vw); }
      .divider { margin: 16px auto 12px; }
      h2 { font-size: clamp(1.75rem, 3.6vw, 2.9rem); }
      .buttons { gap: 10px; }
      .button { min-height: 56px; font-size: 0.59rem; }
      footer { margin-top: 8px; }
    }

    @media (max-width: 720px) {
      body { padding: 10px 0 18px; }
      .bg-scene {
        background-position: 56% center;
        transform: none !important;
        transition: none !important;
        will-change: auto;
      }
      .page { width: min(100% - 22px, 620px); padding: 4px 8px 8px; }
      .main-logo { width: min(242px, 72vw); }
      .tagline { font-size: 0.63rem; letter-spacing: 0.16em; line-height: 1.8; }
      .tagline i { margin: 0 6px; }
      .divider { margin: 14px auto 10px; }
      h2 { font-size: clamp(1.74rem, 9.2vw, 2.74rem); letter-spacing: 0.08em; }
      .buttons { grid-template-columns: 1fr; gap: 10px; }
      .button { min-height: 53px; font-size: 0.67rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .bg-scene, .main-logo, .tagline, .divider, .section, footer { transition: none !important; animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-scene" aria-hidden="true"></div>

  <aside class="hud-rail hud-rail--left" aria-hidden="true">
    <div class="hud-rail__copy">
      <span>35.6895° N<br>139.6917° E</span>
      <span>sys: online</span>
      <div class="hud-rail__dash"><i></i><i></i><i></i></div>
    </div>
  </aside>
  <aside class="hud-rail hud-rail--right" aria-hidden="true"></aside>

  <main class="page">
    <img class="main-logo" src="./assets/akyiro-logo-full-transparent.png" alt="akyiro logo">

    <div class="tagline">ambient <i>/</i> digital <i>/</i> melancholy</div>

    <div class="divider"></div>

    <section class="section section--release">
      <div class="eyebrow">_latest release</div>
      <h2 class="bracket-title">unnamed</h2>
      <div class="status">out now</div>
      <div class="listen">listen now_</div>
      <div class="buttons">
        <a class="button" href="https://open.spotify.com/track/4H0ow29yFlq0jaJVZYeMy4?si=33fe7ef119df4812" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-spotify icon" aria-hidden="true"></i><span>Spotify</span></a>
        <a class="button" href="https://music.apple.com/us/song/unnamed/6776029231" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-apple icon" aria-hidden="true"></i><span>Apple Music</span></a>
        <a class="button" href="https://youtu.be/HgOzBR52dao?si=aEc0F1wmmsmQ2rs5" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube icon" aria-hidden="true"></i><span>YouTube Music</span></a>
      </div>
    </section>

    <div class="divider"></div>

    <section class="section section--ep">
      <div class="eyebrow">_upcoming ep</div>
      <h2 class="bracket-title">the last flower</h2>
      <div class="status">coming soon</div>
    </section>

    <div class="divider"></div>

    <section class="section section--links">
      <div class="eyebrow">personal links_</div>
      <div class="buttons">
        <a class="button" href="https://www.instagram.com/akyiro.music" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram icon" aria-hidden="true"></i><span>Instagram</span></a>
        <a class="button" href="https://www.tiktok.com/@akyiro" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-tiktok icon" aria-hidden="true"></i><span>TikTok</span></a>
        <a class="button" href="https://www.youtube.com/@akyiro" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube icon" aria-hidden="true"></i><span>YouTube</span></a>
      </div>
    </section>

    <footer>© akyiro</footer>
  </main>

  <script>
    const bg = document.querySelector('.bg-scene');
    const desktopMotion = window.matchMedia('(min-width: 721px) and (pointer: fine) and (prefers-reduced-motion: no-preference)');

    const updateParallax = (event) => {
      if (!desktopMotion.matches || !bg) return;
      const x = (event.clientX / window.innerWidth - 0.5) * 18;
      const y = (event.clientY / window.innerHeight - 0.5) * 10;
      bg.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1.045)`;
    };

    const resetParallax = () => {
      if (!bg) return;
      bg.style.transform = desktopMotion.matches
        ? 'translate3d(0,0,0) scale(1.045)'
        : 'none';
    };

    window.addEventListener('pointermove', updateParallax, { passive: true });
    window.addEventListener('mouseleave', resetParallax);
    desktopMotion.addEventListener('change', resetParallax);
    resetParallax();
  </script>
</body>
</html>
