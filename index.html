<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>akyiro</title>

  <meta property="og:title" content="akyiro">
  <meta property="og:description" content="ambient / cyberpunk / metalcore">
  <meta property="og:image" content="https://akyiro.xyz/assets/og-image.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://akyiro.xyz">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="akyiro">
  <meta name="twitter:description" content="ambient / cyberpunk / metalcore">
  <meta name="twitter:image" content="https://akyiro.xyz/assets/og-image.png">

  <link rel="icon" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #020202;
      --text: #f2eee9;
      --muted: #9d948d;
      --orange: #d76518;
      --orange-soft: rgba(215, 101, 24, 0.48);
      --orange-glow: rgba(255, 112, 24, 0.18);
      --card: rgba(255,255,255,0.025);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 8%, rgba(215,101,24,0.14), transparent 22%),
        radial-gradient(circle at 50% 60%, rgba(215,101,24,0.045), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: "Michroma", sans-serif;
      text-align: center;
      padding: 42px 18px 34px;
      overflow-x: hidden;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .flower {
      width: min(300px, 72vw);
      margin: 0 auto 28px;
      display: block;
      filter:
        drop-shadow(0 0 10px rgba(255, 112, 24, 0.38))
        drop-shadow(0 0 28px rgba(255, 112, 24, 0.16));
      opacity: 0.96;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 7.2rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: lowercase;
    }

    .tagline {
      margin-top: 24px;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.38em;
      text-transform: lowercase;
    }

    .tagline span {
      color: var(--orange);
      margin: 0 14px;
    }

    .divider {
      height: 1px;
      margin: 62px 0 42px;
      background: linear-gradient(90deg, transparent, var(--orange-soft), transparent);
      position: relative;
    }

    .divider::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 1px solid var(--orange);
      background: var(--bg);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 12px rgba(255, 112, 24, 0.32);
    }

    .label {
      color: var(--orange);
      font-size: 0.74rem;
      letter-spacing: 0.42em;
      text-transform: lowercase;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 4.2rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }

    .status {
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .listen {
      color: var(--orange);
      font-size: 0.78rem;
      letter-spacing: 0.42em;
      text-transform: lowercase;
      margin-bottom: 24px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .button {
      min-height: 82px;
      border: 1px solid rgba(215,101,24,0.62);
      background:
        radial-gradient(circle at 50% 0%, rgba(215,101,24,0.085), transparent 62%),
        var(--card);
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: lowercase;
      transition: 0.22s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--orange);
      box-shadow: 0 0 22px var(--orange-glow);
    }

    .icon {
      width: 25px;
      height: 25px;
      color: var(--orange);
      flex: 0 0 auto;
    }

    footer {
      margin-top: 62px;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.28em;
    }

    @media (max-width: 720px) {
      body { padding-top: 34px; }

      .flower {
        width: min(230px, 76vw);
      }

      h1 {
        letter-spacing: 0.18em;
        padding-left: 0.18em;
      }

      .tagline {
        letter-spacing: 0.18em;
        line-height: 2;
      }

      .tagline span {
        margin: 0 7px;
      }

      .buttons {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .button {
        min-height: 70px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img class="flower" src="assets/logo-neon.png" alt="akyiro flower logo">

    <h1>akyiro</h1>

    <div class="tagline">
      ambient <span>/</span> cyberpunk <span>/</span> metalcore
    </div>

    <div class="divider"></div>

    <section>
      <div class="label">latest release</div>
      <h2>「unnamed」</h2>
      <div class="status">out now</div>

      <div class="listen">listen now</div>

      <div class="buttons">
        <a class="button" href="https://open.spotify.com/track/4H0ow29yFlq0jaJVZYeMy4?si=33fe7ef119df4812" target="_blank">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8A10.2 10.2 0 1 0 12 22.2 10.2 10.2 0 0 0 12 1.8Zm4.68 14.72a.74.74 0 0 1-1.02.25c-2.8-1.7-6.32-2.08-10.47-1.14a.74.74 0 1 1-.33-1.44c4.54-1.04 8.44-.59 11.56 1.32.35.21.47.67.26 1.01Zm1.25-2.8a.93.93 0 0 1-1.28.3c-3.2-1.96-8.08-2.53-11.86-1.38a.93.93 0 0 1-.54-1.78c4.32-1.31 9.7-.68 13.38 1.57.44.27.58.84.3 1.29Zm.11-2.92C14.2 8.52 7.86 8.31 4.2 9.42a1.1 1.1 0 0 1-.64-2.1c4.2-1.27 11.2-1.02 15.62 1.6a1.1 1.1 0 1 1-1.13 1.88Z"/></svg>
          spotify
        </a>

        <a class="button" href="https://music.apple.com/us/song/unnamed/6776029231" target="_blank">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16.1 1.7c.1 1.3-.38 2.55-1.15 3.47-.82.98-2.16 1.75-3.45 1.65-.14-1.25.42-2.57 1.16-3.43.84-.98 2.28-1.72 3.44-1.69ZM20.4 17.35c-.48 1.1-.72 1.6-1.35 2.58-.87 1.32-2.1 2.96-3.62 2.98-1.35.02-1.7-.88-3.54-.87-1.84 0-2.23.9-3.58.88-1.52-.02-2.68-1.5-3.55-2.82-2.43-3.7-2.68-8.05-1.18-10.36 1.07-1.65 2.75-2.61 4.34-2.61 1.62 0 2.64.9 3.98.9 1.3 0 2.1-.9 3.98-.9 1.42 0 2.93.78 4 2.12-3.52 1.93-2.95 6.96.02 8.1Z"/></svg>
          apple music
        </a>

        <a class="button" href="https://youtu.be/HgOzBR52dao?si=aEc0F1wmmsmQ2rs5" target="_blank">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.1s-.2-1.5-.82-2.16c-.78-.82-1.65-.83-2.05-.88C15.87 3.85 12 3.85 12 3.85h-.01s-3.87 0-6.73.21c-.4.05-1.27.06-2.05.88C2.6 5.6 2.4 7.1 2.4 7.1S2.2 8.85 2.2 10.6v1.64c0 1.75.2 3.5.2 3.5s.2 1.5.82 2.16c.78.82 1.8.8 2.26.89 1.64.16 6.52.21 6.52.21s3.88 0 6.74-.22c.4-.04 1.27-.05 2.05-.87.61-.66.82-2.16.82-2.16s.2-1.75.2-3.5V10.6c0-1.75-.21-3.5-.21-3.5ZM10.03 14.8V8.72l5.13 3.05-5.13 3.03Z"/></svg>
          youtube music
        </a>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="label">upcoming ep</div>
      <h2>「the last flower」</h2>
      <div class="status">coming soon</div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="label">personal links</div>

      <div class="buttons">
        <a class="button" href="https://www.instagram.com/akyiro.music" target="_blank">instagram</a>
        <a class="button" href="https://www.tiktok.com/@akyiro" target="_blank">tiktok</a>
        <a class="button" href="https://www.youtube.com/@akyiro" target="_blank">youtube</a>
      </div>
    </section>

    <footer>© akyiro</footer>
  </main>
</body>
</html>
